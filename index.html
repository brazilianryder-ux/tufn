<script>window.__STUDIO="\u003c!doctype html>\n\u003chtml lang=\"ru\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>ТУФН — конструктор игр\u003c/title>\n\u003cstyle>\n:root{--bg:#fafafa;--pn:#fff;--ink:#111;--mut:#777;--ln:#e4e4e4;--ls:transparent;--ac:#111;--ai:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media(prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#0e0e0e;--pn:#181818;--ink:#eee;--mut:#999;--ln:#2c2c2c;--ls:#666;--ac:#eee;--ai:#111}}\n:root[data-theme=\"dark\"]{--bg:#0e0e0e;--pn:#181818;--ink:#eee;--mut:#999;--ln:#2c2c2c;--ls:#666;--ac:#eee;--ai:#111}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}\n*{box-sizing:border-box}[hidden]{display:none!important}\nbody{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,\"Segoe UI\",Roboto,sans-serif}\nbutton,input,select,textarea{font:inherit;color:inherit}\nheader{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--ln);flex-wrap:wrap}\n.logo{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:.12em}\nnav{display:flex;background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:2px;margin-left:auto}\nnav button{border:0;background:none;padding:6px 12px;border-radius:8px;color:var(--mut)}\nnav .on{background:var(--ac);color:var(--ai)}\n.pri{background:var(--ac);color:var(--ai);border:0;border-radius:10px;padding:8px 14px;font-weight:600}\n.b{background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:7px 11px;cursor:pointer}\nmain{max-width:1000px;margin:0 auto;padding:14px}\n.sc{display:grid;gap:12px}\n@media(min-width:760px){.sc{grid-template-columns:1fr 260px;align-items:start}}\n#cv,#pc{width:100%;aspect-ratio:16/9;background:#fff;border:1px solid var(--ln);border-radius:12px;touch-actio und:rgba(0,0,0,.5)}\ntextarea{width:100%;height:200px;font:12px/1.4 ui-monospace,Menlo,monospace;background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:8px}\n.fr{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px;align-items:center}\n.fr button{border:1px solid var(--ln);background:var(--pn);border-radius:8px 8px 0 0;padding:5px 11px;color:var(--mut)}\n.fr .on{background:var(--ac);color:var(--ai)}\n.fr input{width:110px;padding:5px 8px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);margin-left:auto}\n.st{font:12px ui-monospace,Menlo,monospace;color:var(--mut);margin-top:6px}\n.ol{display:grid;gap:4px}\n.ol div{display:flex;gap:2px;align-items:center;padding:3px 6px;border:1px solid var(--ln);border-radius:8px;font-size:13px;cursor:pointer}\n.ol .on{border-color:#2f6fed}.ol span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n.ol button{border:0;background:none;padding:2px 4px}\n.card.off{opacity:.45}\n.card.ev2{padding-left:44px}\n.card .n{position:absolute;left:0;top:0;bottom:0;width:32px;display:grid;place-items:center;border-right:1px solid var(--ln);color:var(--mut);font-size:12px}\n@media(min-width:760px){.card.ev2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.card.ev2 .sent{grid-column:1/3}}\n.vars{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:12px}\n.vars span{border:1px solid var(--ln);border-radius:8px;padding:3px 9px;background:var(--pn);font-size:13px;cursor:pointer}\n:root{--bg:#eceef1;--pn:#fff;--ink:#1b1f24;--mut:#5f6b7a;--ln:#cfd4db;--ac:#2457c5;--ai:#fff;--ls:transparent}\n@media(prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#121418;--pn:#1b1e23;--ink:#e6e8eb;--mut:#8b93a1;--ln:#2b3038;--ac:#3b82f6;--ai:#fff;--ls:#6b7280}}\n:root[data-theme=\"dark\"]{--bg:#121418;--pn:#1b1e23;--ink:#e6e8eb;--mut:#8b93a1;--ln:#2b3038;--ac:#3b82f6;--ai:#fff;--ls:#6b7280}\nbody{font-size:13px}\nheader{background:var(--pn);padding:0 12px;min-height:46px;gap:8px \" y=\"7\" width=\"18\" height=\"18\" rx=\"5\" transform=\"rotate(15 16 16)\" fill=\"#000\" stroke=\"var(--ls)\"/>\u003c/svg>ТУФН\u003c/div>\n  \u003cnav id=\"tabs\">\u003cbutton data-t=\"scene\" class=\"on\">Сцена\u003c/button>\u003cbutton data-t=\"ev\">События\u003c/button>\u003c/nav>\n  \u003cbutton class=\"pri\" id=\"play\" title=\"F7 — запустить кадр\">▶ Тест\u003c/button>\u003cbutton class=\"b\" id=\"pa\" title=\"F8 — запустить приложение с первого кадра\">▶▶\u003c/button>\u003cbutton class=\"pri\" id=\"pub\" title=\"Выложить игру в ТУФН\">Опубликовать в ТУФН\u003c/button>\n\u003c/header>\n\u003cmain>\n\u003csection id=\"scene\">\n  \u003cdiv class=\"bar\">\n    \u003cbutton class=\"b\" data-add=\"rect\">▭ Блок\u003c/button>\u003cbutton class=\"b\" data-add=\"circle\">● Шар\u003c/button>\u003cbutton class=\"b\" data-add=\"text\">T Текст\u003c/button>\n    \u003cbutton class=\"b\" data-add=\"img\">🖼 Картинка\u003c/button>\u003cinput type=\"color\" id=\"bg\" title=\"Фон кадра\">\u003cbutton class=\"b\" id=\"un\" title=\"Отменить (Ctrl+Z)\">↶\u003c/button>\u003cbutton class=\"b\" id=\"re\" title=\"Повторить (Ctrl+Y)\">↷\u003c/button>\u003cbutton class=\"b\" id=\"pj\" style=\"margin-left:auto\">Проект\u003c/button>\u003cbutton class=\"b\" id=\"exp\">Экспорт\u003c/button>\u003cinput type=\"file\" id=\"im\" accept=\"image/*\" hidden>\n  \u003c/div>\n  \u003cdiv class=\"sc\">\n    \u003cdiv>\u003cdiv class=\"fr\" id=\"fr\">\u003c/div>\u003ccanvas id=\"cv\" width=\"640\" height=\"360\">\u003c/canvas>\u003cdiv class=\"st\" id=\"st\">\u003c/div>\u003c/div>\n    \u003cdiv class=\"panel\">\n      \u003cb class=\"sub\">Объекты кадра (сверху — передний план)\u003c/b>\u003cdiv class=\"ol\" id=\"ol\">\u003c/div>\u003cp class=\"hint\" id=\"nh\" style=\"margin-top:10px\">Выберите объект на сцене или в списке. Тяните за квадратик в углу — изменить размер.\u003c/p>\n      \u003cdiv id=\"ip\" hidden>\n        \u003clabel>Имя\u003cinput data-k=\"name\">\u003c/label>\n        \u003c const IDS={1:['name','email','pass','pass2'],2:['born','role'],3:['code','terms']};
const CHK={
1:d=>({name:!/^[\wа-яё-]{3,20}$/i.test(d.name)?'3–20 символов: буквы, цифры, _ и -':RESV.includes(d.name.toLowerCase())?'Этот логин зарезервирован':A.users.some(u=>u.name.toLowerCase()===d.name.toLowerCase())&&'Этот логин уже занят',
email:!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(d.email)?'Введите почту вида name@mail.ru':mailErr(d.email)||A.users.some(u=>u.email===d.email)&&'Эта почта уже зарегистрирована',
pass:!(d.pass.length>=8&&pw(d.pass)>=3)&&'Нужно 8+ символов, заглавные и строчные буквы, цифра или знак',
pass2:d.pass2!==d.pass&&'Пароли не совпадают'}),
2:d=>({born:!d.born?'Укажите дату рождения':age(d.born)<13?'Регистрация доступна с 13 лет':age(d.born)>110&&'Проверьте дату'}),
3:d=>({code:!R.nm&&!/^\d{6}$/.test(d.code)&&'Введите 6 цифр',terms:!d.terms&&'Нужно принять правила'})};

/* ── почта без сервера: письмо с кодом уходит прямо из браузера через EmailJS (REST, без своего бэкенда) ──
   Настройка: emailjs.com → Email Services (подключить почту) → Email Templates (поле «To email» = {{to_email}}, в тексте {{code}}) → Account → Public Key. */
const MAIL={url:''},   // url — адрес вашего почтовика (mailer.mjs); пусто → проверка без письма

DISP=['mailinator.com','guerrillamail.com','10minutemail.com','tempmail.com','temp-mail.org','yopmail.com','trashmail.com','sharklasers.com','throwawaymail.com','getnada.com','dispostable.com','maildrop.cc','fakeinbox.com'],
TYPO={'gmial.com':'gmail.com','gmai.com':'gmail.com','gmail.con':'gmail.com','gamil.com':'gmail.com','yandex.ry':'yandex.ru','yadex.ru':'yandex.ru','mail.ry':'mail.ru','mial.ru':'mail.ru','maill.ru':'mail.ru','yahooo.com':'yahoo.com','outlok.com':'outlook.com','hotmial.com':'hotmail.com'},
RESV=['admin','administrator','moder','moderator','support','official','tufn','туфн','админ','модератор','поддержка'],
hsh=async s=>b64(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)));
function mailErr(e){const d=e.split('@')[1].toLowerCase();return DISP.includes(d)?'Одноразовые адреса не принимаются':TYPO[d]?'Опечатка? Возможно, @'+TYPO[d]:''}
async function sendCode(email,name,force){
  const now=Date.now(),H=(()=>{try{return JSON.parse(localStorage.getItem('tufn_mail')||'[]').filter(t=>now-t<36e5)}catch(e){return[]}})();
  if(!force&&R.ch&&R.em===email&&now<R.exp)return 1;                       // вернулись назад и снова вперёд — код тот же
  if(R.at&&now-R.at<6e4){toast('Повторно можно через '+Math.ceil((6e4-now+R.at)/1e3)+' с');return 0}
  if(H.length>=5){toast('Слишком много писем за час. Попробуйте позже');return 0}
  const code=String(1e5+crypto.getRandomValues(new Uint32Array(1))[0]%9e5),cs=b64(crypto.getRandomValues(new Uint8Array(12)));
  if(MAIL.url){toast('Отправляю письмо…');
    try{const r=await fetch(MAIL.url,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({to:email,name,code,app:'ТУФН',minutes:10})});   // text/plain — без CORS-предзапроса
      if(!r.ok)throw Error((await r.text()).slice(0,120)||r.status)}catch(e){toast('Письмо не ушло: '+(e.message||e));return 0}
    R.nm=0}else R.nm=1;
  R.ch=await hsh(code+':'+email+':'+cs);Object.assign(R,{cs,em:email,exp:now+6e5,tries:0,at:now});H.push(now);   // в памяти только хэш кода
  try{localStorage.setItem('tufn_mail',JSON.stringify(H))}catch(e){}return 1}
async function pow(e){const t=Date.now(),s=b64(crypto.getRandomValues(new Uint8Array(8))),te=new TextEncoder();toast('Проверяем, что вы человек…');
  for(let n=0;;n++){const h=new Uint8Array(await crypto.subtle.digest('SHA-256',te.encode(e+':'+s+':'+n)));if(h[0]===0&&h[1]<4)return'';
    if(n%1500===0){await new Promise(r=>setTimeout(r));if(Date.now()-t>25e3)return'Проверка не прошла — попробуйте ещё раз'}}}
async function codeErr(d){if(!R.ch||Date.now()>R.exp)return'Код устарел — отправьте новый';if(++R.tries>5){R.ch=0;return'Слишком много попыток — отправьте новый код'}
  return await hsh(d.code+':'+d.email+':'+R.cs)===R.ch?'':'Неверный код'}
function codeNote(m){return R.nm?'<p>Письмо не отправляется: у сайта нет своего почтового сервера. Нажмите «Создать аккаунт» — мы за пару секунд проверим, что вы человек. Почта останется неподтверждённой.</p>':`<p>Мы отправили 6‑значный код на <b>${esc(m)}</b>. Он действует 10 минут; загляните в «Спам».</p><div class="row"><button class="btn sm ghost" data-a="resend">Отправить ещё раз</button></div>`}

['Нужен ли сервер или оплата?','Нет. Сайт бесплатный, а данные хранятся не в одном месте, а в общей сети открытых узлов (реле) и в вашем браузере.'],

VW.rules=()=>DOC('Правила платформы',`<p>ТУФН — для людей от 13 лет. Здесь можно спорить, но нельзя причинять вред.</p>
<h3>1. Уважение</h3><ul><li>Не оскорбляйте, не травите и не угрожайте.</li><li>Не унижайте людей за происхождение, пол, возраст, веру, здоровье и взгляды.</li><li>Не выдавайте себя за другого человека или за ТУФН.</li></ul>
<h3>2. Запрещено</h3><ul><li>Контент, нарушающий закон; любой сексуальный контент с участием несовершеннолетних — такие материалы мы скрываем сразу.</li><li>Призывы к насилию, самоповреждению и экстремизму.</li><li>Мошенничество, фишинг, обман, спам, накрутка реакций.</li><li>Чужие личные данные без согласия (адреса, телефоны, документы).</li><li>Вредоносный код и ссылки на него.</li></ul>
<h3>3. Игры</h3><ul><li>Публикуйте только свои игры или те, на которые у вас есть права.</li><li>Описание, жанр и возрастная метка должны быть честными.</li><li>Игра не должна красть данные, майнить, обманывать или пытаться выйти за пределы песочницы.</li><li>Цена и условия — только честные; платные ссылки не должны вводить в заблуждение.</li></ul>
<h3>4. Как мы следим за порядком</h3><p>Участники присылают жалобы, а доверенные модераторы ставят метки; публикации с метками могут скрываться из ленты. За повторные нарушения аккаунт могут ограничить в показе. Если вы не согласны, напишите нам.</p>
<h3>5. Удаление</h3><p>Свои публикации вы можете удалить, но ТУФН работает на общих узлах сети и не может стереть запись с чужого сервера.</p>`);
VW.terms=()=>DOC('Пользовательское соглашение',`<h3>1. О сервисе</h3><p>ТУФН — бесплатная социальная сеть и площадка игр. Сервис предоставляется «как есть»: мы стараемся, чтобы всё работало, но не гарантируем бесперебойность.</p>
<h3>2. Ваш аккаунт</h3><p>Вам должно быть не меньше 13 лет. Вы отвечаете за пароль и за всё, что происходит под вашим аккаунтом. Данные регистрации должны быть вашими.</p>
<h3>3. Ваш контент</h3><p>Права на ваши посты, фото и игры остаются у вас. Публикуя их, вы разрешаете показывать их другим участникам сети и сохранять копии на узлах сети. Вы подтверждаете, что имеете на это право.</p>
<h3>4. Игры других людей</h3><p>Игры создают сторонние авторы. Они запускаются в песочнице, но вы пользуетесь ими на свой риск; за содержание игры отвечает её автор.</p>
<h3>5. Ограничения</h3><p>Нарушение <a href="#rules">Правил</a> может привести к скрытию публикаций и ограничению аккаунта.</p>
<h3>6. Изменения</h3><p>Условия могут обновляться; новая редакция вступает в силу с даты, указанной вверху страницы.</p>`);
VW.privacy=()=>DOC('Политика конфиденциальности',`<h3>Что хранится у вас на устройстве</h3><p>Логин, почта, дата рождения, ключ аккаунта и защищённый хэш пароля хранятся в браузере (IndexedDB и localStorage). Они нужны для входа и работы сайта. Мы не отправляем их на свой сервер — его у нас нет. Вы можете удалить их, очистив данные сайта в браузере.</p>
<h3>Что становится публичным</h3><p>Публичны: посты, комментарии, реакции, опросы, опубликованные игры, а также данные профиля — логин, имя, описание, город, сайт, Telegram, аватар и обложка. Всё это подписывается вашим ключом и рассылается по открытым узлам сети (реле), которыми управляют независимые люди. Почту, дату рождения и пароль мы в сеть не отправляем.</p>
<h3>Личные сообщения</h3><p>Личные сообщения шифруются на вашем устройстве. Узлы сети видят, что сообщение отправлено, но не его текст.</p>
<h3>Третьи стороны</h3><ul><li>Узлы сети (реле) видят ваш IP-адрес при подключении и хранят публичные записи.</li><li>Игры на движках (Phaser, Three.js и др.) могут загружать библиотеки с сети доставки cdn.jsdelivr.net — она тоже видит IP-адрес.</li><li>Если почтовый сервер подключён, адрес получателя и код передаются ему, чтобы отправить письмо.</li><li>Рекламы, аналитики и сторонних трекеров в самой странице нет.</li></ul>
<h3>Удаление</h3><p>Удаляя пост или игру, вы отправляете в сеть запрос на удаление. Узлы обычно ему следуют, но копии могут остаться — мы не контролируем чужие серверы. Поэтому не публикуйте то, что не хотели бы видеть публично.</p>
<h3>Дети</h3><p>Сервис для людей от 13 лет. Если вам меньше — не регистрируйтесь.</p>
<h3>Изменения</h3><p>При изменении политики мы обновим дату вверху страницы.</p>`);

/* ── Криптография secp256k1 на чистом BigInt. В «Эфире» точки складывались в аффинных координатах

const CR=(()=>{
const enc=new TextEncoder(),P=2n**256n-2n**32n-977n,N=0xFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFEBAAEDCE6AF48A03BBFD25E8CD0364141n;
const G=[0x79BE667EF9DCBBAC55A06295CE870B07029BFCDB2DCE28D959F2815B16F81798n,0x483ADA7726A3C4655DA4FBFC0E1108A8FD17B448A68554199C47D08FFB10D4B8n];
const mod=(a,m=P)=>((a%m)+m)%m;

const aff=p=>{if(!p)return null;const zi=inv(p[2]),z2=zi*zi%P;return[p[0]*z2%P,p[1]*z2%P*zi%P]};

const ser=e=>JSON.stringify([0,e.pubkey,e.created_at,e.kind,e.tags,e.content]);
const HX=(s,n)=>typeof s==='string'&&s.length===n&&/^[0-9a-f]+$/.test(s);
const shape=e=>e&&typeof e==='object'&&HX(e.id,64)&&HX(e.pubkey,64)&&HX(e.sig,128)&&Number.isInteger(e.created_at)&&e.created_at>1.6e9&&
  [0,1,3,5,6,7,13,1059,1984,1985,30000,31555,1018,1068,10000,10003,30078,31556].includes(e.kind)&&typeof e.content==='string'&&e.content.length<=(e.kind===0?2000:e.kind===13||e.kind===1059||e.kind===30078?16000:500)&&Array.isArray(e.tags)&&e.tags.length<=(e.kind===3||e.kind===30000||e.kind===10000||e.kind===10003?500:24)&&
  e.tags.every(t=>Array.isArray(t)&&t.length<=4&&t.every(x=>typeof x==='string'))&&JSON.stringify(e).length<=70000;

})();

/* ═══ v0.7: подписки, личка, опросы, уведомления, репосты, цитаты, @упоминания, закладки, списки, подборки, версии игр, теги и поиск, достижения ═══
   В сети: контакты — kind 3 (NIP‑02), личка — kind 4 (NIP‑04), репост — kind 6 (NIP‑18), цитата — kind 1 + тег q,
   упоминание — тег p, хэштег — тег t, опрос — kind 1068, голос — kind 1018 (NIP‑88).
   На устройстве: закладки, мьюты, списки людей, подборки, версии игр. Достижения считаются из подписанных событий. */
const NA={},
MY=()=>{const u=me();return u&&(u.my||(u.my={fl:[],mu:[],bk:[],ls:[],cl:[],ach:[],ns:Date.now(),dn:Date.now()}))},
kk=u=>u&&(u.pk||u.id),
byKey=k=>A.users.find(u=>u.pk===k||u.id===k)||RUp.get(k),
byName=n=>{n=n.toLowerCase();return A.users.find(u=>u.name.toLowerCase()===n)||[...RUp.values()].find(u=>u.name.toLowerCase()===n)},
nmOf=u=>u?u.dn||u.name:'Аноним',
fols=()=>{const m=MY(),u=me(),s=new Set(m?m.fl:[]);if(u&&u.pk&&ND.ct[u.pk])ND.ct[u.pk].l.forEach(x=>s.add(x));return s},
followers=u=>{const s=new Set();for(const pk in ND.ct)if(u.pk&&ND.ct[pk].l.includes(u.pk))s.add(pk);A.users.forEach(x=>{if(x!==u&&x.my&&x.my.fl.includes(kk(u)))s.add(kk(x))});return s.size},
following=u=>new Set([...(u.pk&&ND.ct[u.pk]?ND.ct[u.pk].l:[]),...(u.my?u.my.fl:[])]).size,
TAGRE=/#([\wа-яё-]{2,30})/gi,
ex=t=>{const o=[],h=new Set(),p=new Set();                              // хэштеги → t, упоминания → p
  for(const m of t.matchAll(TAGRE)){const k=m[1].toLowerCase();if(h.size<5&&!h.has(k)){h.add(k);o.push(['t',k])}}
  for(const m of t.matchAll(/@([\wа-яё-]{3,24})/gi)){const u=byName(m[1]);if(u&&u.pk&&p.size<5&&!p.has(u.pk)){p.add(u.pk);o.push(['p',u.pk])}}return o},

/* ── личка: NIP‑04 (ECDH + AES‑CBC) ── */
const fromB=s=>Uint8Array.from(atob(s),x=>x.charCodeAt(0)),
ak=async(sk,pk)=>crypto.subtle.importKey('raw',await ecdh(sk,pk),'AES-CBC',false,['encrypt','decrypt']),
enc4=async(u,to,t)=>{const iv=crypto.getRandomValues(new Uint8Array(16));return b64(await crypto.subtle.encrypt({name:'AES-CBC',iv},await ak(u.sk,to),new TextEncoder().encode(t)))+'?iv='+b64(iv)},
dec4=async(u,pk,s)=>{const[c,i]=s.split('?iv=');return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-CBC',iv:fromB(i)},await ak(u.sk,pk),fromB(c)))},
DC=new Map(),RM=new Map(),
dec=async(u,e)=>{if(DC.has(e.id))return DC.get(e.id);let t;try{t=await dec4(u,e.pubkey===u.pk?tg1(e,'p'):e.pubkey,e.content)}catch(x){t='⚠ не удалось расшифровать'}DC.set(e.id,t);return t},
convs=u=>{const m=MY(),c={};[...RM.values()].forEach(e=>{if(e.own!==u.pk)return;const to=tg1(e,'p');const p=e.pubkey===u.pk?to:e.pubkey;if(m.mu.includes(p))return;(c[p]=c[p]||[]).push(e)});
  for(const p in c)c[p].sort((a,b)=>a.created_at-b.created_at);return c};

function stats(u){const k=u.pk,mine=o=>(o.pk&&o.pk===k)||o.u===u.id,ps=db.posts.filter(mine),gs=A.games.filter(g=>g.u===u.id);let cm=0;

  return{po:ps.length,cm,rx:[...ps,...gs].reduce((n,o)=>n+rxn(o),0),rg:k?Object.keys(ND.rx).reduce((n,t)=>n+Object.keys(ND.rx[t]).filter(x=>x.startsWith(k+'|')).length,0):0,
    gm:gs.length,pl:gs.reduce((n,g)=>n+(g.plays||0),0),fw:followers(u),fo:following(u),pol:ps.filter(p=>p.poll).length,rp:k?Object.values(ND.rp).filter(e=>e[k]).length:0,vr:gs.reduce((n,g)=>n+(g.vers||[]).length,0)}}

/* ── текст: #теги и @ники становятся ссылками ── */
function rich(t){const f=document.createDocumentFragment(),re=/([#@])([\wа-яё-]{2,30})/gi;let i=0,m;t=String(t||'');
  while(m=re.exec(t)){if(m.index>i)f.append(t.slice(i,m.index));
    if(m[1]==='@'){const u=byName(m[2]);if(u){const a=el('a','lnk',m[0]);a.dataset.u=u.id;f.append(a)}else f.append(m[0])}
    else{const a=el('a','lnk',m[0]);a.dataset.n='tag';a.dataset.v=m[2].toLowerCase();f.append(a)}
    i=re.lastIndex}
  if(i<t.length)f.append(t.slice(i));return f}

  const my=u&&u.pk&&v[u.pk]?v[u.pk][1]:[],w=el('div','poll');

function notes(u){const L=[],mine=o=>!!o&&((o.pk&&o.pk===u.pk)||o.u===u.id),at='@'+u.name.toLowerCase(),
  add=(ts,o,t)=>{const k=typeof o==='string'?o:o.pk||o.u,x=byKey(k);L.push({ts,t:nmOf(x)+' '+t,u:x&&x.id})};
  for(const p of db.posts){const mp=mine(p);
    if(mp){for(const k in ND.rx[p.id]||{}){const[pk,s]=k.split('|');if(pk!==u.pk)add(ND.rx[p.id][k][0]*1000,pk,'поставил(а) «'+ST[s][0]+'» на ваш пост')}
      for(const pk in ND.rp[p.id]||{})if(pk!==u.pk)add(ND.rp[p.id][pk][0]*1000,pk,'репостнул(а) ваш пост');
      for(const pk in ND.pv[p.id]||{})if(pk!==u.pk)add(ND.pv[p.id][pk][0]*1000,pk,'проголосовал(а) в вашем опросе')}
    else{if(p.q&&mine(byId(p.q)))add(p.ts,p,'процитировал(а) ваш пост');else if((p.t||'').toLowerCase().includes(at))add(p.ts,p,'упомянул(а) вас в посте')}
    for(const c of p.c||[]){if(mine(c))continue;const par=c.p&&p.c.find(x=>x.id===c.p);
      if(par&&mine(par))add(c.ts,c,'ответил(а) на ваш комментарий');else if(mp)add(c.ts,c,'прокомментировал(а) ваш пост');else if((c.t||'').toLowerCase().includes(at))add(c.ts,c,'упомянул(а) вас в комментарии')}}
  for(const pk in ND.ct)if(pk!==u.pk&&u.pk&&ND.ct[pk].l.includes(u.pk))add(ND.ct[pk].c*1000,pk,'подписался(лась) на вас');
  return L}

/* ═══ v0.9: децентрализованная модерация, Web of Trust, синхронизация жалоб, отзывы игр ═══
   Модераторов «сверху» нет. Куратор публикует список модераторов (kind 30000, d=tufn-mods). Каждый клиент выбирает кураторов,
   которым верит (kind 30000, d=tufn-trust — синхронизируется между устройствами), и учитывает метки (kind 1985) только от модераторов из этих списков.
   Жалобы — kind 1984, у каждой есть вес по Web of Trust (граф подписок). Отзывы игр — kind 31555 (d=g:<id>, rating 0|1). */
const ROOT=[],   // ← стартовые кураторы (hex‑ключи) — лишь выбор по умолчанию, у каждого клиента он меняется на странице #trust
RT={spam:'Спам',profanity:'Оскорбления',nudity:'Неприемлемое (18+)',impersonation:'Выдаёт себя за другого',illegal:'Незаконное',other:'Другое'},
VK='<svg class="vk" viewBox="0 0 24 24" width="16" height="16" role="img" aria-label="Проверено"><title>Проверено модерацией</title><circle cx="12" cy="12" r="12"/><path d="M7 12.5l3.2 3.2L17 9" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
AX={verified:'v',unverified:'v',ban:'b',unban:'b',hide:'h',unhide:'h'},
LL={hide:'скрыл(а) пост',unhide:'вернул(а) пост',ban:'заблокировал(а)',unban:'снял(а) блок с',verified:'выдал(а) ✓',unverified:'снял(а) ✓ у',resolved:'закрыл(а) жалобу на'},
WL={0:'это вы',1:'ваш круг',2:'2‑й круг',3:'3‑й круг',9:'вне вашей сети'},WM={0:'●●●●',1:'●●●',2:'●●',3:'●',9:'○'},WW={0:1,1:1,2:.6,3:.3,9:.05},
SOFT=2,REV=new Set();
let EMC=null,WC=null,WT=0,RXC=null;
document.head.insertAdjacentHTML('beforeend','<style>.vk{vertical-align:-3px;margin-left:4px}.dmi.on .vk circle{fill:#fff}.dmi.on .vk path{stroke:#000}.rpm{position:fixed;inset:0;background:#0008;display:grid;place-items:center;z-index:50;padding:16px}.rpm .card{width:min(420px,100%);background:#fff}.rpg{border:2px solid #000;border-radius:14px;padding:10px;margin:8px 0}.rpg p{margin:4px 0}.hid{border:2px dashed #000;background:#fff}.rvd{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}.rvs{display:block;color:#555}.rvi{border-top:1px solid #ddd;padding:8px 0}.rvi p{margin:4px 0}.flt{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.flt select{border:2px solid #000;border-radius:10px;padding:4px 8px;background:#fff}</style>');
const curators=()=>{const m=MY();return(m&&m.cu?m.cu:ROOT).filter(k=>HX(k,64))},
nk=k=>{const x=byKey(k);return x?nmOf(x):'ключ '+String(k).slice(0,8)};
function EM(){if(EMC)return EMC;const m=MY(),base=curators(),S=new Set(),add=c=>{S.add(c);((ND.mls[c]||{}).l||[]).forEach(x=>S.add(x))};
  base.forEach(add);   // эффективные модераторы = кураторы + их списки (+ кураторы кураторов, если ≥2 общих — «Web of Trust» для модераторов)
  if(m&&m.wd){const n={};base.forEach(c=>((ND.tr[c]||{}).l||[]).forEach(x=>{if(!base.includes(x))n[x]=(n[x]||0)+1}));for(const x in n)if(n[x]>=Math.min(2,base.length))add(x)}
  return EMC=S}
function lab(T,l){const B=ND.lb[T];if(!B)return 0;const ax=AX[l],E=EM();let best=-1,res=0;for(const k in B){const[i,a]=k.split('|');if(a!==ax||!E.has(i))continue;if(B[k][0]>=best){best=B[k][0];res=B[k][1]===l}}return res}
const isMod=u=>!!(u&&u.pk&&EM().has(u.pk)),isV=pk=>!!pk&&!!lab(pk,'verified'),vOf=u=>!!(u&&(isV(u.pk)||u.id==='u0'));
/* ── Web of Trust: круг 1 = ваши подписки и кураторы; круг 2 = те, на кого подписаны ≥2 из круга 1; круг 3 = ещё дальше ── */
function wot(){if(WC&&Date.now()-WT<4e3)return WC;const u=me(),L1=new Set(),f1={},f2={};
  if(u&&u.pk){fols().forEach(k=>HX(k,64)&&L1.add(k));curators().forEach(k=>L1.add(k))}
  L1.forEach(a=>((ND.ct[a]||{}).l||[]).forEach(x=>{f1[x]=(f1[x]||0)+1}));
  const L2=new Set(Object.keys(f1).filter(x=>!L1.has(x)&&f1[x]>=2));L2.forEach(a=>((ND.ct[a]||{}).l||[]).forEach(x=>{f2[x]=(f2[x]||0)+1}));
  WT=Date.now();return WC={me:u&&u.pk,L1,L2,f1,f2}}
const wlv=pk=>{const w=wot();return pk===w.me?0:w.L1.has(pk)?1:w.L2.has(pk)?2:(w.f1[pk]||0)>=1||(w.f2[pk]||0)>=2?3:9},wgt=pk=>WW[wlv(pk)],rw=pk=>EM().has(pk)?1.5:wgt(pk);
const rsc=id=>{if(!RXC){RXC={};ND.rep.forEach(r=>{if(!r.e)return;const o=RXC[r.e]||(RXC[r.e]={s:0,ts:0});o.s+=rw(r.by);o.ts=Math.max(o.ts,r.ts)});
  for(const e in RXC){let m=0;EM().forEach(i=>{m=Math.max(m,(ND.rs[e]||{})[i]||0)});RXC[e].done=m*1000>=RXC[e].ts}}return RXC[id]};
async function pubx(u,kind,content,tags){const ev=await pub(u,kind,content,tags);ND.rout=[ev,...ND.rout.filter(e=>e.id!==ev.id)].slice(0,100);save();return ev}   // + хранится и досылается на реле при каждом подключении
ND.dme=ND.dme.filter(e=>e.kind===1059);   // старые NIP‑04 больше не читаем
/* NIP‑44 v2: ECDH → HKDF → ChaCha20 + HMAC-SHA256, паддинг по спецификации */
const nU8=s=>new TextEncoder().encode(s),
nHm=async(k,d)=>new Uint8Array(await crypto.subtle.sign('HMAC',await crypto.subtle.importKey('raw',k,{name:'HMAC',hash:'SHA-256'},false,['sign']),d)),
nCk=async(sk,pk)=>nHm(nU8('nip44-v2'),await ecdh(sk,pk)),
nMk=async(c,n)=>{let t=new Uint8Array(0);const o=[];for(let i=1;i<=3;i++){t=await nHm(c,CR.cat(t,n,Uint8Array.of(i)));o.push(t)}const k=CR.cat(...o);return{c:k.slice(0,32),n:k.slice(32,44),h:k.slice(44,76)}},
nPl=n=>{if(n<=32)return 32;const p=1<<(Math.floor(Math.log2(n-1))+1),c=p<=256?32:p/8;return c*(Math.floor((n-1)/c)+1)};
function nCc(key,nonce,data,c0=0){const K=new DataView(key.buffer,key.byteOffset,32),M=new DataView(nonce.buffer,nonce.byteOffset,12),s=new Uint32Array(16),out=new Uint8Array(data.length),rl=(v,n)=>(v<<n)|(v>>>(32-n));
 s.set([0x61707865,0x3320646e,0x79622d32,0x6b206574]);for(let i=0;i<8;i++)s[4+i]=K.getUint32(i*4,true);for(let i=0;i<3;i++)s[13+i]=M.getUint32(i*4,true);
 for(let blk=0;blk*64<data.length;blk++){s[12]=c0+blk;const x=s.slice(),q=(a,b,c,d)=>{x[a]+=x[b];x[d]=rl(x[d]^x[a],16);x[c]+=x[d];x[b]=rl(x[b]^x[c],12);x[a]+=x[b];x[d]=rl(x[d]^x[a],8);x[c]+=x[d];x[b]=rl(x[b]^x[c],7)};
  for(let r=0;r<10;r++){q(0,4,8,12);q(1,5,9,13);q(2,6,10,14);q(3,7,11,15);q(0,5,10,15);q(1,6,11,12);q(2,7,8,13);q(3,4,9,14)}
  for(let i=0;i<64&&blk*64+i<data.length;i++){const w=(x[i>>2]+s[i>>2])>>>0;out[blk*64+i]=data[blk*64+i]^((w>>>((i&3)*8))&255)}}return out}
async function nEn(text,ck){const m=nU8(text);if(!m.length||m.length>65535)throw Error('длина сообщения');const n=crypto.getRandomValues(new Uint8Array(32)),k=await nMk(ck,n),pd=new Uint8Array(2+nPl(m.length));pd[0]=m.length>>8;pd[1]=m.length&255;pd.set(m,2);
 const ct=nCc(k.c,k.n,pd);return b64(CR.cat(Uint8Array.of(2),n,ct,await nHm(k.h,CR.cat(n,ct))))}
async function nDe(s,ck){if(typeof s!=='string'||s[0]==='#'||s.length<132||s.length>87472)throw Error('формат');const d=fromB(s);if(d[0]!==2)throw Error('версия');
 const n=d.slice(1,33),ct=d.slice(33,-32),mac=d.slice(-32),k=await nMk(ck,n),m2=await nHm(k.h,CR.cat(n,ct));let z=0;for(let i=0;i<32;i++)z|=m2[i]^mac[i];if(z)throw Error('MAC');
 const p=nCc(k.c,k.n,ct),l=(p[0]<<8)|p[1];if(!l||p.length!==2+nPl(l))throw Error('паддинг');return new TextDecoder().decode(p.slice(2,2+l))}

async function dm17(u,peer,text){const now=Math.floor(Date.now()/1e3),rnd=()=>now-crypto.getRandomValues(new Uint32Array(1))[0]%172800,
  r={pubkey:u.pk,created_at:now,kind:14,tags:[['p',peer]],content:text},out=[];
  r.id=CR.hex(await CR.sha(nU8(CR.ser(r))));
  for(const to of[peer,u.pk]){                                      // копия получателю и копия себе
    const seal=await CR.raw(u.sk,13,await nEn(JSON.stringify(r),await nCk(u.sk,to)),[],rnd()),e=CR.newKey();
    out.push(await CR.raw(e.sk,1059,await nEn(JSON.stringify(seal),await nCk(e.sk,to)),[['p',to]],rnd()))}
  return out}
async function unwrap(sk,w){const seal=JSON.parse(await nDe(w.content,await nCk(sk,w.pubkey)));

 for(;;){const k=Math.min(1,s/Math.max(i.width,i.height));cv.width=Math.max(1,Math.round(i.width*k));cv.height=Math.max(1,Math.round(i.height*k));cv.getContext('2d').drawImage(i,0,0,cv.width,cv.height);o=cv.toDataURL('image/jpeg',q);if(o.length<=44000||s<=160)break;s=Math.round(s*.8);q=Math.max(.5,q-.05)}
 r(o.length<=44000?o:null)};i.onerror=()=>r(null);i.src=u});
{const pb=el('button','btn sm ghost','Фото'),pi=document.createElement('input'),pv=el('div');pb.type='button';pi.type='file';pi.accept='image/*';pi.hidden=true;pv.id='ppv';pv.hidden=true;

ACT.login=async()=>{
 if(Date.now()<lock)return err('all','Слишком много попыток. Подождите '+Math.ceil((lock-Date.now())/1e3)+' с');
 const raw=$('#f-lg').value.trim(),id=raw.toLowerCase().normalize('NFC'),pw=$('#f-lp').value;
 if(!id||!pw)return err('all','Введите логин и пароль');

 for(const u of us)if(await window.tufnPw(pw,u)){fails=0;A.sid=u.id;NS.pid=u.id;save();const b=NS.back;NS.back=null;return to(b||'profile')}

document.addEventListener('click',e=>{if(!e.target.closest('[data-rec]'))return;e.preventDefault();
 const w=el('div','mdl');w.innerHTML='<div class="mc"><h2>Восстановление по ключу</h2><p class="mut">Секретный ключ (64 символа: цифры и буквы a–f) — из копии, сохранённой в разделе «Ваш ключ». Он подтверждает, что аккаунт ваш. Задайте новый пароль; если аккаунта на этом устройстве нет, укажите прежний логин.</p><label>Логин<input id="rc-n" maxlength="20" autocomplete="username"></label><label>Секретный ключ<input id="rc-k" autocomplete="off" spellcheck="false"></label><label>Новый пароль (от 8 символов)<input id="rc-p" type="password" autocomplete="new-password"></label><small class="err" id="rc-e"></small><div class="row"><button class="btn" id="rc-go">Восстановить</button><button class="btn ghost" id="rc-x">Отмена</button></div></div>';
 document.body.append(w);const q=x=>w.querySelector(x),ber=m=>{q('#rc-e').textContent=m};w.onclick=x=>{if(x.target===w||x.target.closest('#rc-x'))w.remove()};
 q('#rc-go').onclick=async()=>{const nm=q('#rc-n').value.trim(),sk=q('#rc-k').value.trim().toLowerCase().replace(/^0x/,''),pw=q('#rc-p').value;
  if(!/^[0-9a-f]{64}$/.test(sk)||!CR.okKey(sk))return ber('Ключ — это 64 символа: цифры и буквы a–f');if(pw.length<8)return ber('Пароль — от 8 символов');
  const pk=CR.pkOf(sk);let u=A.users.find(x=>!x.demo&&x.pk===pk);
  if(!u){if(!/^[\wа-яё-]{3,20}$/i.test(nm))return ber('Укажите логин: 3–20 символов (буквы, цифры, _ и -)');
   if(A.users.some(x=>x.name.toLowerCase()===nm.toLowerCase()))return ber('Этот логин занят другим аккаунтом на устройстве');
   if(typeof RESV!=='undefined'&&RESV.includes(nm.toLowerCase()))return ber('Этот логин зарезервирован')}
  const salt=b64(crypto.getRandomValues(new Uint8Array(16))),h=await hash(pw,salt);
  if(u){u.salt=salt;u.hash=h;u.sk=sk}else{u={id:'u'+Date.now(),name:nm,email:'',salt,hash:h,role:'play',born:'',emailOk:false,av:{k:'shaka',c:'#ffd23f'},ban:0,bio:'',ts:Date.now(),sk,pk};A.users.push(u)}
  fails=0;A.sid=u.id;NS.pid=u.id;save();w.remove();toast('Доступ восстановлен');to('profile')}});
